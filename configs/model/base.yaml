# U-Net "base" (ROADMAP 4.7): small with wider channels. UNetConfig fields except C, K, H.
# Build with wm.models.unet.unet_config(load_config(path), C, K, H); `ch` is picked by H.
ch:
  84: [128, 256, 384]        # 84 -> 42 -> 21; 34.4M parameters at C=3, K=4
  96: [128, 256, 384, 384]   # 96 -> 48 -> 24 -> 12; 52.8M
n_res: 2
emb_dim: 256
n_levels: 10
attn_lowest: false
dropout: 0.0
