# Milestone 2 E9 error analysis (scripts/m2_errors.py).
#   python scripts/m2_errors.py events --config configs/eval/m2_errors.yaml --models copy_last runs/<run>/checkpoints/ckpt_last.pt
#   python scripts/m2_errors.py nn --config configs/eval/m2_errors.yaml --models runs/<run>/checkpoints/ckpt_last.pt
models: [copy_last]       # copy_last and/or checkpoint paths (--models overrides)
dataset_dirs: [data/eval] # rollouts start here, as in configs/eval/rollouts.yaml
n: 64                     # trajectories, one per episode, spread evenly over the episodes
start: 32                 # first row used in each episode
T: 200                    # generated frames per trajectory
K: 4                      # copy_last only; a checkpoint's own K is used otherwise
num_steps: null           # sampler steps; null = the checkpoint's default
cfg_scale: null           # action CFG weight; null = the checkpoint's default
seed: 0                   # CPU sampler generator, reseeded per model
batch_size: 16            # trajectories generated at once
match_window: 2           # a generated event matches a real one within this many steps
report_horizons: [1, 5, 20, 50, 100, 200]
n_examples: 3             # missed hits and missed deaths shown in events_examples.png
nn:
  train_dirs: [data/full] # every frame of their train split is searched
  val_fraction: 0.05      # must match training (4.5)
  horizons: [1, 20, 50]   # generated frames compared with the training set
  chunk_rows: 4096        # shard rows per search chunk
  num_workers: 8          # loader workers decoding shard chunks
out_dir: results/milestone2/e9
